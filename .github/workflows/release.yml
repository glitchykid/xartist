name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node scripts/desktop-smoke.mjs
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/desktop-smoke.mjs "release/win-unpacked/X Artist.exe"
      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 release/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v7
        with:
          name: X-Artist-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem release/*.exe | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets release/SHA256SUMS.txt --verify-tag --prerelease --title "X Artist $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
